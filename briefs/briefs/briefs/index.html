<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-market briefs · Longlight</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #FAF9F5;
  --surface: #F1EEE7;
  --card: #FFFFFF;
  --text: #141413;
  --muted: #5F5C56;
  --border: #E2DED5;
  --accent: #7B3FC4;
  --accent-soft: #EFE6FA;
  --clay: #D97757;
  --clay-text: #A8482A;
  --link: #6A33AD;
  --session: #B48CE8;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #141413;
    --surface: #1C1B19;
    --card: #1F1E1B;
    --text: #FAF9F5;
    --muted: #A9A59C;
    --border: #2E2C28;
    --accent: #B48CE8;
    --accent-soft: #2A2238;
    --clay: #E8967A;
    --clay-text: #E8967A;
    --link: #B48CE8;
    --session: #7B3FC4;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 17px;
  line-height: 1.55;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }
a { color: var(--link); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.9rem; color: var(--muted); }
.top a { color: var(--muted); text-decoration: none; }
.top a:hover { color: var(--text); }

/* Masthead: the date is the headline */
.masthead { margin: 2rem 0 1.5rem; }
.masthead h1 {
  margin: 0;
  font-size: clamp(2.4rem, 11vw, 4rem);
  line-height: 0.95;
  letter-spacing: -0.035em;
  font-weight: 700;
}
.masthead .sub { margin: 0.6rem 0 0; color: var(--muted); font-size: 1rem; }

/* Session strip: 4:00 to 20:00 ET, regular hours shaded */
.session { margin: 1.5rem 0 0; }
.strip {
  position: relative; height: 10px; border-radius: 5px;
  background: var(--surface); border: 1px solid var(--border); overflow: visible;
}
.strip .rth { position: absolute; top: -1px; bottom: -1px; background: var(--session); border-radius: 2px; }
.strip .now {
  position: absolute; top: -6px; width: 3px; height: 20px; margin-left: -1.5px;
  background: var(--clay); border-radius: 2px;
}
.ticks { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; }
.status { margin: 0.75rem 0 0; font-weight: 600; font-size: 1.05rem; }

/* Brief content */
.brief { margin-top: 2.5rem; }
.brief h1 { font-size: 1.6rem; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
.brief .tldr { font-size: 1.1rem; color: var(--muted); margin: 0 0 2rem; }
.brief h2 {
  font-size: 1.15rem; margin: 2.25rem 0 0.75rem; padding-left: 0.75rem;
  border-left: 3px solid var(--accent); letter-spacing: -0.01em;
}
.brief p { margin: 0 0 0.8rem; }
.brief ul { padding-left: 1.2rem; margin: 0 0 1rem; }
.brief li { margin-bottom: 0.45rem; }
.brief li::marker { color: var(--clay); }
.brief strong { font-weight: 600; }
.brief small { display: block; margin-top: 2.5rem; color: var(--muted); font-size: 0.8rem; }
.brief table { border-collapse: collapse; font-size: 0.9rem; }
.brief .table-wrap { overflow-x: auto; }
.brief th, .brief td { border-bottom: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
.brief h2#sources + ul { font-size: 0.85rem; color: var(--muted); }
.brief h2#sources + ul a { color: var(--muted); }

.viewing-old {
  background: var(--accent-soft); border-radius: 8px; padding: 0.6rem 0.9rem;
  font-size: 0.9rem; margin-top: 2rem; display: flex; justify-content: space-between; gap: 1rem; align-items: center;
}
.viewing-old button {
  font: inherit; font-weight: 600; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer;
}

/* Archive */
.archive { margin-top: 4rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
.archive h2 { font-size: 1.15rem; margin: 0 0 0.5rem; }
.archive ol { list-style: none; padding: 0; margin: 0; }
.archive li button {
  width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0;
  padding: 0.85rem 0; border-bottom: 1px solid var(--border); cursor: pointer;
  display: grid; grid-template-columns: 5.5rem 1fr; gap: 0.75rem;
}
.archive li button[aria-current="true"] .d { color: var(--clay-text); }
.archive .d { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.archive .h { font-size: 0.95rem; }
.archive .t { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
.more { margin-top: 1rem; font: inherit; font-weight: 600; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; }

.empty { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="../">Longlight Interactive</a>
    <span>Pre-market briefs</span>
  </div>

  <header class="masthead">
    <h1 id="dateline">Today</h1>
    <p class="sub">MU and the AI complex, written before the open.</p>
    <div class="session" aria-label="US trading session">
      <div class="strip">
        <div class="rth" id="rth"></div>
        <div class="now" id="nowMark" hidden></div>
      </div>
      <div class="ticks" id="ticks"></div>
      <p class="status" id="status"></p>
    </div>
  </header>

  <div id="oldNotice"></div>
  <article class="brief" id="brief" aria-live="polite"><p class="empty">Loading today’s brief…</p></article>

  <section class="archive" aria-labelledby="archiveTitle">
    <h2 id="archiveTitle">Past briefs</h2>
    <ol id="archiveList"></ol>
    <button class="more" id="moreBtn" hidden>Show older briefs</button>
  </section>
</div>

<script>
// Where the briefs live. RAW is a fallback in case Pages hasn't rebuilt yet.
const RAW = "https://raw.githubusercontent.com/Jxstrr0/Kelbo.Website/main/briefs/";
const PAGE_SIZE = 20;

const $ = (id) => document.getElementById(id);
let index = [];
let shown = PAGE_SIZE;

async function getText(name) {
  const bust = "?t=" + Date.now();
  for (const base of ["./", RAW]) {
    try {
      const r = await fetch(base + name + bust, { cache: "no-store" });
      if (r.ok) return await r.text();
    } catch (e) { /* try next */ }
  }
  throw new Error("Couldn’t load " + name);
}

function skToday() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Regina" }).format(new Date());
}
function prettyDate(iso, opts) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString("en-US", { timeZone: "UTC", ...opts });
}

// ---- Session strip ----
function etParts(date) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour: "numeric", minute: "numeric", weekday: "short", hourCycle: "h23",
  }).formatToParts(date).map((x) => [x.type, x.value]));
  return { min: Number(p.hour) * 60 + Number(p.minute), wd: p.weekday };
}
function skOffsetHours() {
  const h = (tz) => Number(new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", hourCycle: "h23" }).format(new Date()));
  return (h("America/New_York") - h("America/Regina") + 24) % 24;
}
function fmtDur(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return h ? `${h}h ${mm}m` : `${mm}m`;
}
function drawSession() {
  const START = 4 * 60, END = 20 * 60, OPEN = 9 * 60 + 30, CLOSE = 16 * 60;
  const span = END - START;
  const pct = (m) => ((m - START) / span) * 100;
  $("rth").style.left = pct(OPEN) + "%";
  $("rth").style.width = (pct(CLOSE) - pct(OPEN)) + "%";

  const off = skOffsetHours();
  const sk = (etMin) => {
    const t = etMin - off * 60, h = Math.floor(t / 60), m = t % 60;
    const h12 = ((h + 11) % 12) + 1;
    return `${h12}:${String(m).padStart(2, "0")}`;
  };
  $("ticks").innerHTML = `<span>Pre ${sk(START)}</span><span>Open ${sk(OPEN)}</span><span>Close ${sk(CLOSE)}</span><span>${sk(END)} SK</span>`;

  const { min, wd } = etParts(new Date());
  const weekday = !["Sat", "Sun"].includes(wd);
  const mark = $("nowMark");
  if (weekday && min >= START && min <= END) {
    mark.hidden = false;
    mark.style.left = pct(min) + "%";
  } else {
    mark.hidden = true;
  }
  let s;
  if (!weekday) s = "Weekend. Markets reopen Monday.";
  else if (min < OPEN) s = `Opens in ${fmtDur(OPEN - min)}, at ${sk(OPEN)} SK`;
  else if (min < CLOSE) s = `Market open. Closes in ${fmtDur(CLOSE - min)}.`;
  else s = "Closed for the day. Next brief posts before the open.";
  $("status").textContent = s;
}

// ---- Briefs ----
function renderMarkdown(md) {
  // Pull the TLDR line out so it can be styled
  let tldr = "";
  md = md.replace(/^TLDR:\s*(.+)$/m, (_, t) => { tldr = t; return ""; });
  let html = DOMPurify.sanitize(marked.parse(md, { breaks: true }), { ADD_ATTR: ["target"] });
  if (tldr) {
    const safe = DOMPurify.sanitize(marked.parseInline(tldr));
    html = html.replace(/(<\/h1>)/, `$1<p class="tldr">${safe}</p>`);
  }
  return html;
}

async function showBrief(date) {
  const el = $("brief");
  const today = skToday();
  $("dateline").textContent = prettyDate(date, { weekday: "long", month: "short", day: "numeric" });
  if (date !== index[0]?.date) {
    $("oldNotice").innerHTML = `<div class="viewing-old"><span>Viewing the brief from ${prettyDate(date, { month: "long", day: "numeric", year: "numeric" })}.</span><button id="backBtn">Latest brief</button></div>`;
    $("backBtn").onclick = () => { history.pushState(null, "", location.pathname); showBrief(index[0].date); };
  } else if (date !== today) {
    $("oldNotice").innerHTML = `<div class="viewing-old"><span>No brief yet today. Showing the most recent one.</span></div>`;
  } else {
    $("oldNotice").innerHTML = "";
  }
  el.innerHTML = `<p class="empty">Loading…</p>`;
  try {
    el.innerHTML = renderMarkdown(await getText(date + ".md"));
    el.querySelectorAll("table").forEach((t) => {
      const w = document.createElement("div"); w.className = "table-wrap";
      t.replaceWith(w); w.appendChild(t);
    });
    el.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  } catch (e) {
    el.innerHTML = `<p class="empty">This brief couldn’t be loaded. Refresh to try again.</p>`;
  }
  drawArchive(date);
  if (date !== index[0]?.date) window.scrollTo({ top: 0, behavior: "smooth" });
}

function drawArchive(current) {
  const list = $("archiveList");
  list.innerHTML = "";
  index.slice(0, shown).forEach((e) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.setAttribute("aria-current", e.date === current ? "true" : "false");
    b.innerHTML = `<span class="d"></span><span class="h"></span>`;
    b.querySelector(".d").textContent = prettyDate(e.date, { month: "short", day: "numeric" });
    b.querySelector(".h").textContent = e.headline;
    if (e.tldr) {
      const t = document.createElement("span"); t.className = "t"; t.textContent = e.tldr;
      b.querySelector(".h").appendChild(t);
    }
    b.onclick = () => { history.pushState(null, "", "#" + e.date); showBrief(e.date); };
    li.appendChild(b);
    list.appendChild(li);
  });
  $("moreBtn").hidden = index.length <= shown;
}
$("moreBtn").onclick = () => { shown += PAGE_SIZE; drawArchive(location.hash.slice(1) || index[0]?.date); };

function fromHash() {
  const h = location.hash.slice(1);
  const hit = index.find((e) => e.date === h);
  showBrief(hit ? hit.date : index[0].date);
}
window.addEventListener("popstate", () => index.length && fromHash());

async function init() {
  drawSession();
  setInterval(drawSession, 60000);
  try {
    index = JSON.parse(await getText("index.json"));
  } catch (e) { index = []; }
  if (!index.length) {
    $("dateline").textContent = prettyDate(skToday(), { weekday: "long", month: "short", day: "numeric" });
    $("brief").innerHTML = `<p class="empty">No briefs yet. The first one posts around 7 AM SK on the next weekday, or run it now from the repo’s Actions tab.</p>`;
    return;
  }
  fromHash();
}
init();
</script>
</body>
</html>
