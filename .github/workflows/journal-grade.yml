# Grades the journal's weekly calls: the Scorekeeper.
#
# Every Sunday around noon (after Friday's close), this:
#   1. runs .github/scripts/journal-grade.mjs, which finds the newest
#      journal entry whose "gradeBy" day has closed and still has ungraded
#      calls, asks Claude (the smaller model, effort high, with web
#      search) what really happened, and fills in each call's grade and
#      result, then the recap, the AI coach note and the lesson. A call
#      whose prices can't be confirmed stays ungraded. Nothing waiting:
#      no call.
#   2. commits journal.json to main,
#   3. starts the "Deploy site" run so the record updates.
#
# It uses the ANTHROPIC_API_KEY repository secret. "Run workflow" on the
# Actions tab runs it now; tick "dry run" to see the grades in the log
# without saving them. To stop it, open it on the Actions tab, tap "..."
# and choose "Disable workflow".
name: Scorekeeper (weekly journal grades)

# Sunday around noon, so the half-price batch has the whole afternoon to
# come back before the Forecaster writes the next week that evening. Two
# tries in case GitHub starts one late or drops it: 11:37 am and 1:13 pm
# Sunday, Saskatoon time (17:37 and 19:13 UTC). The second either finds
# nothing left to grade and stops before calling Claude, or picks up a
# batch the first had to leave waiting (.github/batches/scorekeeper.json).
on:
  schedule:
    - cron: "37 17 * * 0"
    - cron: "13 19 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the grades in the log, save nothing"
        type: boolean
        default: false
      force:
        description: "Grade the newest finished week again (replaces its grades)"
        type: boolean
        default: false

permissions:
  contents: write # to commit journal.json
  actions: write # to start the Deploy site run

concurrency:
  group: journal-grade
  cancel-in-progress: false

jobs:
  grade:
    name: Grade the week's calls
    runs-on: ubuntu-latest
    timeout-minutes: 350 # a batch can take a while; the script stops waiting at 320
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Look up the week and grade the calls
        id: robot
        run: node .github/scripts/journal-grade.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          FORCE: ${{ inputs.force == true && '1' || '' }}

      - name: Commit them to main
        id: commit
        if: inputs.dry_run != true
        run: |
          git config user.name "scorekeeper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/batches
          git add -A journal.json .github/batches
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a change to the site's own files needs a deploy; the saved
          # batch file lives in .github, which is never published.
          if git diff --cached --quiet -- journal.json; then site=false; else site=true; fi
          if [ "$site" = true ]; then
            git commit -m "Journal grades $(TZ=America/Regina date +%F)"
          else
            git commit -m "scorekeeper: batch still waiting, saved for the next run"
          fi
          git pull --rebase
          git push
          echo "pushed=$site" >> "$GITHUB_OUTPUT"

      - name: Put the site live
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
