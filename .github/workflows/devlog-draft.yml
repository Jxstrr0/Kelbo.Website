# Weekly devlog drafts for Kelbo to review.
#
# Every Sunday, this:
#   1. runs .github/scripts/devlog-draft.mjs, which collects the last 7 days
#      of merged pull requests and releases from each game's repo and asks
#      Claude (one call, no web search) to draft 0 to 4 devlog posts, at
#      most one per game. No game activity: no call, nothing else happens.
#   2. runs the site check on the drafts (a pull request opened by this
#      workflow doesn't start the Site check by itself),
#   3. puts them on a new branch, devlog-draft/YYYY-MM-DD, and opens a pull
#      request "Devlog draft for the week of ..." listing each post with
#      links to where it came from.
# The pull request is NEVER merged automatically. Read it on your phone,
# edit devlog.json on that branch if a post needs fixing, then merge it
# (the site updates) or close it (nothing changes).
#
# It uses the ANTHROPIC_API_KEY repository secret. "Run workflow" on the
# Actions tab runs it now; tick "dry run" to see the drafts in the log
# without opening a pull request. To stop it, open it on the Actions tab,
# tap "..." and choose "Disable workflow".
#
# It asks Claude through the Batches API (half price) and waits for the
# answer, usually within an hour. If that takes over 5 h 20, it saves its
# place in .github/batches/devlog-writer.json (committed to main, never
# published) and the 5:13 pm run picks the same answer up, so nothing is
# paid twice. That second run stops at once if today's draft already exists.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests" switched on, or step 3 fails.
name: Devlog Writer (weekly devlog draft)

# 17:23 UTC = 11:23 am Saskatoon on Sundays; 23:13 UTC = 5:13 pm pickup.
on:
  schedule:
    - cron: "23 17 * * 0"
    - cron: "13 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the drafts in the log, open no pull request"
        type: boolean
        default: false

permissions:
  contents: write # to push the draft branch
  pull-requests: write # to open the pull request

concurrency:
  group: devlog-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Draft this week's posts
    runs-on: ubuntu-latest
    timeout-minutes: 350 # a batch can take a while; the script stops waiting at 320
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The 5:13 pm try: if today's draft branch is already there and no
      # batch is waiting, there's nothing to do (and nothing to pay).
      - name: Already drafted today?
        id: done
        run: |
          branch="devlog-draft/$(TZ=America/Regina date +%F)"
          if [ ! -f .github/batches/devlog-writer.json ] && git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists and no batch is waiting. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the week and draft posts
        id: draft
        if: steps.done.outputs.skip != 'true'
        run: node .github/scripts/devlog-draft.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}

      # Saves (or clears) the batch's place on main, so the next run can
      # pick it up. Only this file goes to main; the drafts never do.
      - name: Save the batch's place
        if: steps.done.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          git config user.name "devlog-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/batches
          git add -A .github/batches
          if git diff --cached --quiet; then exit 0; fi
          if [ -f .github/batches/devlog-writer.json ]; then msg="devlog-writer: batch still waiting, saved for the next run"; else msg="devlog-writer: batch picked up"; fi
          git commit -m "$msg" -- .github/batches
          git pull --rebase --autostash
          git push

      - name: Check the site with the drafts in it
        if: steps.draft.outputs.posts > 0
        run: node .github/scripts/check-site.mjs

      - name: Open a pull request for Kelbo (never merged automatically)
        if: steps.draft.outputs.posts > 0
        run: |
          branch="devlog-draft/$(TZ=America/Regina date +%F)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists (a draft was made earlier today). Close or merge it, delete the branch, then run this again."
            exit 0
          fi
          git config user.name "devlog-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add devlog.json
          git commit -m "Devlog draft for the week of ${{ steps.draft.outputs.week }}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Devlog draft for the week of ${{ steps.draft.outputs.week }}" \
            --body-file "${{ steps.draft.outputs.body_file }}"
        env:
          GH_TOKEN: ${{ github.token }}
