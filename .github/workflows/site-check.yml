# Runs the site check on every pull request, so a mistake shows up as a
# red X on the PR before it's merged, instead of on the live site.
# The check itself lives in .github/scripts/check-site.mjs.
name: Site check

on:
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  check:
    name: Site check # this name is what a branch rule would require
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the site
        run: node .github/scripts/check-site.mjs
      # The Longlight Passport's tests: stamp codes, the stamp check, the
      # replace rule (plain node:test, no packages; .github/PASSPORT.md).
      - name: Test the Passport
        run: node --test .github/scripts/passport.test.mjs
      # The deploy makes a page for each game (make-game-pages.mjs). Try it
      # on a throwaway copy, so a change that breaks it shows up here too.
      - name: Check the game pages the deploy will make
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          node .github/scripts/make-game-pages.mjs _site
          node .github/scripts/make-feed.mjs _site
          node .github/scripts/check-site.mjs _site
