# Grades the morning's pre-market brief after the US market closes.
#
# Every weekday after the close (Saskatchewan has no daylight saving, and
# 4:45 pm Saskatoon time is after the 4:00 pm ET close in both summer and
# winter), this:
#   1. runs .github/scripts/postmarket-recap.mjs, which asks Claude (with
#      web search) how MU really traded and grades the brief's gap call and
#      key levels into report-cards/YYYY-MM.json and report-cards/index.json
#      (the brief itself in briefs/ is never changed),
#   2. runs the Site check on them, and only if it passes commits them to main,
#   3. starts the "Deploy site" run so the "How it did" box goes live.
#      (A push made by a workflow doesn't start other workflows on its own.)
# Weekends, US market holidays and days without a brief are skipped.
#
# It uses the same ANTHROPIC_API_KEY repository secret as the brief. "Run
# workflow" on the Actions tab runs it right now; tick the box to grade
# today again. To stop it, open it on the Actions tab, tap "..." and
# choose "Disable workflow".
name: Grader (after-close report card)

# Started by the Robot Timer, a Cloudflare Worker (.github/worker/robot-timer.js),
# at 4:45 pm Saskatoon time with a backup try at 5:45 pm, Monday to Friday.
# GitHub's own timer ("schedule:") ran hours late, so it was removed. The
# first run grades the day; a later one sees the report card is already
# there and stops before calling Claude.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Redo today's grade even if there already is one"
        type: boolean
        default: false

permissions:
  contents: write # to commit the report card
  actions: write # to start the Deploy site run

concurrency:
  group: postmarket-recap
  cancel-in-progress: false

jobs:
  grade:
    name: Grade and publish
    runs-on: ubuntu-latest
    # The job runs in the "robots" Environment (Settings → Environments). The
    # API key is kept there and only main may use it, so a workflow on any
    # other branch can't read the key.
    environment: robots
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Grade today's brief
        run: node .github/scripts/postmarket-recap.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # "1" when the box was ticked on a hand-started run, else empty.
          FORCE: ${{ inputs.force == true && '1' || '' }}

      # Runs the Site check (with its privacy scan) on the new files
      # first. If they don't pass, the run stops here and nothing is
      # saved: everything in the repo is public for good.
      - name: Check it before saving
        run: node .github/scripts/check-before-save.mjs

      - name: Commit it to main
        id: commit
        run: |
          git config user.name "grader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p report-cards
          git add report-cards
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Report card $(TZ=America/Regina date +%F)"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Put the site live
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
