name: Pre-market brief

on:
  schedule:
    # 12:50 UTC = 6:50 AM Saskatchewan time, Monday to Friday, all year (posts around 7)
    - cron: "50 12 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: premarket-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write today's brief
        run: node scripts/premarket-brief.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "premarket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Pre-market brief $(TZ=America/Regina date +%F)"
          git pull --rebase
          git push

      - name: Rebuild GitHub Pages
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
