# The journal's weekly forecast: the Forecaster.
#
# Every Sunday night, this:
#   1. runs .github/scripts/journal-forecast.mjs, which asks Claude (the
#      bigger model, effort high, with web search) for the coming week's
#      forecast: TLDR, view, sectors, 4 to 6 calls with a "wrong if",
#      scenarios, levels, schedule and plan, in the same shape as the
#      entries Kelbo wrote by hand. It goes at the top of journal.json.
#      A week that already has an entry is skipped before any call.
#   2. commits journal.json to main,
#   3. starts the "Deploy site" run so the journal page shows it.
# The Scorekeeper (journal-grade.yml) grades the calls on Friday.
#
# It uses the ANTHROPIC_API_KEY repository secret. "Run workflow" on the
# Actions tab runs it now; tick "dry run" to see the entry in the log
# without saving it. To stop it, open it on the Actions tab, tap "..."
# and choose "Disable workflow".
name: Forecaster (weekly journal forecast)

# It asks Claude through the Batches API (half price): the answer usually
# comes back within an hour, and the run waits for it (up to 5 hours 20).
# Started by the Robot Timer, a Cloudflare Worker (.github/worker/robot-timer.js),
# at 7:45 and 9:15 pm Sunday and 4:35 am Monday, Saskatoon time, after US
# futures open at 6 pm New York time (GitHub's own timer ran late, so it
# was removed). A later run that finds the entry already there stops before
# calling Claude; one that finds a batch still waiting (saved in
# .github/batches/forecaster.json) picks it up instead of paying again.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the entry in the log, save nothing"
        type: boolean
        default: false
      force:
        description: "Write this week's forecast again (replaces the robot's own entry only)"
        type: boolean
        default: false

permissions:
  contents: write # to commit journal.json
  actions: write # to start the Deploy site run

concurrency:
  group: journal-forecast
  cancel-in-progress: false

jobs:
  forecast:
    name: Write next week's forecast
    runs-on: ubuntu-latest
    timeout-minutes: 350 # a batch can take a while; the script stops waiting at 320
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Research the week and write the forecast
        id: robot
        run: node .github/scripts/journal-forecast.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          FORCE: ${{ inputs.force == true && '1' || '' }}

      - name: Commit them to main
        id: commit
        if: inputs.dry_run != true
        run: |
          git config user.name "forecaster"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/batches
          git add -A journal.json .github/batches
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a change to the site's own files needs a deploy; the saved
          # batch file lives in .github, which is never published.
          if git diff --cached --quiet -- journal.json; then site=false; else site=true; fi
          if [ "$site" = true ]; then
            git commit -m "Journal forecast $(TZ=America/Regina date +%F)"
          else
            git commit -m "forecaster: batch still waiting, saved for the next run"
          fi
          git pull --rebase
          git push
          echo "pushed=$site" >> "$GITHUB_OUTPUT"

      - name: Put the site live
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
