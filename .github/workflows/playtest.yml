# Playtest group (one-off, by hand only).
#
# Claude Opus 5.5 (high effort) plays seven Longlight games on a pretend phone as a
# brand-new player, twice each (two separate players, all 14 at once), and notes
# where it gets confused, stuck or pleased. Then Claude Fable 5.2 (high effort)
# reads all 14 reports and writes one compiled report.
# It's paid (Kelbo's estimate: about US$10-15 in all), so it never runs on a
# schedule: only "Run workflow" starts it. Each player stops at its move cap or
# its dollar cap, whichever comes first.
#
# The log shows only move counts and cost. The notes, screenshots and the report
# are the run's artifacts, kept for 3 days. This workflow and the two
# playtest scripts get deleted once the report is read.
name: Playtester (one-off)

on:
  workflow_dispatch:
    inputs:
      moves:
        description: "Most actions per player"
        default: "70"
      budget:
        description: "Most US$ per player (hard stop)"
        default: "1.5"
      dry_run:
        description: "Dry run: load each game and screenshot it, no Claude calls"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playtest
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: [lombard, scrapline, pew, ink, escapement, frontierlab, thewhip]
        player: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The browser is installed in a temp folder on the runner, not in the
      # repo, so the repo stays package-free.
      - name: Install a browser (runner only)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: Play
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PW_DIR: ${{ runner.temp }}/pw
          MOVES: ${{ inputs.moves }}
          BUDGET: ${{ inputs.budget }}
          DRY: ${{ inputs.dry_run }}
        run: |
          extra=""; [ "$DRY" = "true" ] && extra="--dry"
          node .github/scripts/playtest.mjs ${{ matrix.game }} --player ${{ matrix.player }} --moves "$MOVES" --budget "$BUDGET" $extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-${{ matrix.game }}-p${{ matrix.player }}
          path: playtest-out/
          retention-days: 3

  report:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: playtest-*
          path: playtest-out/
          merge-multiple: true
      - name: Write the report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY: ${{ inputs.dry_run }}
        run: |
          extra=""; [ "$DRY" = "true" ] && extra="--dry"
          node .github/scripts/playtest-report.mjs $extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            playtest-out/report.md
            playtest-out/report-prompt.txt
          if-no-files-found: ignore
          retention-days: 3
